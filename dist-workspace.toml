[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# BoringSSL（btls-sys）需要的额外构建工具链（NASM / musl 交叉编译器）。
# 步骤内容见该文件；由 cargo-dist 注入到各 build 作业。
github-build-setup = "../build-setup.yml"

# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# musl 静态目标由 build-setup.yml 安装固定版本的 Bootlin musl C++ 工具链
# （自带面向 musl 的 libstdc++）。每次 PR 先由 ci.yml 的 musl-static 作业验证，
# 通过后才恢复到发布矩阵；来源/校验/信任评估见 scripts/install-musl-toolchain.sh。
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
