[package]
name = "webctl-mcp"
description = "webctl 的 MCP server：工具 schema 与 DSH 集成契约"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "webctl-mcp"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
webctl-core.workspace = true
webctl-web.workspace = true
# ADR-0005 / #128：受限内置 JS 引擎（沙箱 + 最小 DOM）。默认关闭，只有显式开启才执行页面脚本。
webctl-js.workspace = true
tokio.workspace = true
url.workspace = true
# rmcp 3.5.1：MCP 官方 Rust SDK（Apache-2.0）。仅启用 server + stdio 传输：
# - 不启用 client / reqwest / transport-child-process，运行期不引入任何子进程能力；
# - schemars 由 server 特性拉入，16 个工具的 inputSchema 由 derive 生成。
# 版本理由：3.5.1 是本机离线 registry 已缓存的版本，且实现 MCP 2025-06-18/2026-07-28
# 协议协商（MCP-01）；与 wreq 的依赖树不冲突（不启用 reqwest）。
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
schemars = "1"

[dev-dependencies]
# #82：复用 webctl-web 的离线 HTTP fixture（tests/support/http_fixture.rs）做降级/SEC-09
# 的端到端断言；该 fixture 用 encoding_rs 注入非 UTF-8 编码。仅测试期依赖，不进生产树。
encoding_rs.workspace = true

[lints]
workspace = true
