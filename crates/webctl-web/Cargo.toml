[package]
name = "webctl-web"
description = "webctl 内置层：取回、解析、协议级会话、文档与数据处理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
webctl-core.workspace = true
encoding_rs.workspace = true
futures-util.workspace = true
url.workspace = true
wreq.workspace = true
# PR 07 文档内置：纯 Rust PDF 文本层，零子进程。
# lopdf 与 pdf-extract 共用 0.42（见模块文档的 cargo tree 结论），不引入重复版本；
# default-features=false 与 pdf-extract 保持一致，避免多带 chrono/rayon。
pdf-extract = "0.12.1"
lopdf = { version = "0.42", default-features = false }

# 礼貌层需要 tokio 的定时器与信号量（workspace 已统一版本）。
tokio = { workspace = true, features = ["time", "sync"] }

# PR 03 解析层：DOM/选择器、正文提取、HTML→文本、XML 建树
# 关闭默认特性：默认的 "main" 会拉入自带 CLI 的 getopts，解析层用不到。
# PR 06 抽取引擎：search 的正则（线性时间引擎）与 links 过滤；
# 已在 lock 里作为传递依赖存在，升级为直接依赖不新增 crate。
regex = "1"
scraper = { version = "0.27.0", default-features = false }
dom_smoothie = "0.18.2"
html2text = "0.17.3"
roxmltree = "0.21.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[features]
# L0 离线 lane（docs/TESTING.md §1）：`cargo test --features offline`。
# 打开后测试仍然只访问 127.0.0.1 fixture 与本地文件；该 feature 不是一个"放行网络"
# 开关，而是离线通道的显式标记，让 CI 与本地都能用同一条命令区分 L0 与默认门禁。
# 禁止静默降级：feature 关闭时也不得访问外网（见 tests/offline_lane.rs）。
offline = []

[lints]
workspace = true
