[package]
name = "webctl-web"
description = "webctl 内置层：取回、解析、协议级会话、文档与数据处理"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
webctl-core.workspace = true
encoding_rs.workspace = true
futures-util.workspace = true
url.workspace = true
wreq.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio.workspace = true

[features]
# L0 离线 lane（docs/TESTING.md §1）：`cargo test --features offline`。
# 打开后测试仍然只访问 127.0.0.1 fixture 与本地文件；该 feature 不是一个"放行网络"
# 开关，而是离线通道的显式标记，让 CI 与本地都能用同一条命令区分 L0 与默认门禁。
# 禁止静默降级：feature 关闭时也不得访问外网（见 tests/offline_lane.rs）。
offline = []

[lints]
workspace = true
