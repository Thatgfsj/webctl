<!DOCTYPE html>
<html lang="en">
<head><title>Markdown View Fixture</title></head>
<body>
<article>
<h1>Title</h1>
<p>Intro <strong>bold</strong> and <em>italic</em>.</p>
<h2>Steps</h2>
<ul><li>one</li><li>two</li></ul>
<ol><li>first</li><li>second</li></ol>
<pre><code>let x = 1;</code></pre>
<p><a href="https://example.com/a">link text</a></p>
<table>
<thead><tr><th>Name</th><th>Value</th><th>Note</th></tr></thead>
<tbody>
<tr><td>alpha</td><td>1</td><td>first</td></tr>
<tr><td>beta</td><td>2</td><td>second</td></tr>
<tr><td>gamma</td><td>3</td><td>third</td></tr>
</tbody>
</table>
</article>
</body></html>
