[workspace]
resolver = "3"
members = [
    "crates/webctl",
    "crates/webctl-core",
    "crates/webctl-web",
    "crates/webctl-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/Thatgfsj/webctl"
authors = ["Thatgfsj"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webctl-core = { path = "crates/webctl-core" }
webctl-web = { path = "crates/webctl-web" }
webctl-mcp = { path = "crates/webctl-mcp" }
# PR 05 状态层：advisory 文件锁；fslock 在 Unix 上直接调用 flock(2)，
# 锁属于 open file description（per-handle），进程死亡时由内核释放。
fslock = "0.2"
# PR 02 取回层：HTTP 客户端、字符解码、URL 解析与流式读取
encoding_rs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time", "sync"] }
url = "2.5"
# wreq 0.16.1：默认 BoringSSL 后端；gzip/brotli/deflate 负责内容编码解压，stream 允许带上限的分块读取
wreq = { version = "0.16.1", features = ["gzip", "brotli", "deflate", "stream"] }

# 运行时零外部进程（PLAN v0.4 §3.1）：workspace 内禁止 unsafe。
[workspace.lints.rust]
unsafe_code = "forbid"
