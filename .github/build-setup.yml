# 由 dist-workspace.toml 的 github-build-setup 引用：cargo-dist 会把这些步骤
# 注入到每个 build-local-artifacts 作业的构建步骤之前。
#
# 为什么需要它：wreq 使用 BoringSSL（btls-sys），其 CMake 构建需要
#   - Windows：NASM（BoringSSL 的 .asm 汇编）；
#   - Linux x86_64-musl：自带 libstdc++ 的 musl C++ 交叉工具链
#     （Ubuntu 的 musl-tools/musl-dev 只有 C 侧，见议题 #90）；
#   - 所有 Linux 构建：libclang（btls-sys 用 bindgen 生成绑定）。
# 缺任一项时发布会在 CMake enable_language / bindgen 处失败。
#
# 工具链版本、SHA256、来源与信任评估统一在 scripts/install-musl-toolchain.sh，
# 与 ci.yml 的 musl-static 作业共用，避免 CI 与发布环境漂移。
- name: Install extra build toolchain (BoringSSL / btls-sys)
  if: runner.os == 'Windows' || contains(matrix.targets, 'x86_64-unknown-linux-musl')
  shell: bash
  run: |
    set -eux
    if [ "${RUNNER_OS}" = "Windows" ]; then
      choco install nasm -y
      echo "C:/Program Files/NASM" >> "$GITHUB_PATH"
    elif [ "${RUNNER_OS}" = "Linux" ]; then
      sudo apt-get update
      sudo apt-get install -y libclang-dev
      bash scripts/install-musl-toolchain.sh
    fi
