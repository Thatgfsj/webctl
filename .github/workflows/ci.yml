name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test
      - name: clippy (offline lane)
        run: cargo clippy --all-targets --features offline -- -D warnings
      - name: test (offline lane)
        run: cargo test --features offline
      - name: build (release)
        run: cargo build --release

  pr-size:
    name: pr-size (行数口径)
    # 只在 PR 上跑：口径是相对 base 的差分
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 计算计入 / 不计入行数（CONTRIBUTING §2）
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -uo pipefail
          git fetch --no-tags origin "$BASE_REF"
          BASELINE="origin/$BASE_REF"
          ALLOW=""
          if printf '%s' "$PR_LABELS" | tr ',' '\n' | grep -qx 'lines: exempt'; then
            echo "::notice::PR 带 lines: exempt 标签 ⇒ 越线放行（批准记录应在关联 issue 中）"
            ALLOW="--allow-over"
          fi
          bash scripts/pr-size.sh "$BASELINE" $ALLOW > /tmp/pr-size.txt 2>&1
          code=$?
          cat /tmp/pr-size.txt
          { echo "### PR 行数口径（CONTRIBUTING §2）"; echo '```'; cat /tmp/pr-size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  # 每次 PR 都验证 musl 静态目标（议题 #90）。
  # 之前的 release 失败根因：Ubuntu 的 musl-tools 只带 C 侧，没有面向 musl 的
  # libstdc++；BoringSSL(btls-sys) 的 C++ 源码无法编译/链接。这里改用 Bootlin
  # 的 musl C++ 交叉工具链（固定版本 + SHA256），并用 file/ldd/readelf 硬断言静态。
  musl-static:
    name: musl-static (x86_64-unknown-linux-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-static
      - name: Cache pinned musl C++ toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/webctl-musl-toolchain
          key: musl-toolchain-bootlin-2026.08-1-${{ runner.os }}-${{ runner.arch }}
      - name: Install BoringSSL build dependency (libclang for bindgen)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
      - name: Install pinned musl C++ toolchain
        run: scripts/install-musl-toolchain.sh
      - name: Build webctl + webctl-mcp (musl, release)
        run: cargo build --release --target x86_64-unknown-linux-musl -p webctl -p webctl-mcp
      - name: Assert static linkage (file / ldd / readelf)
        run: |
          scripts/check-static-binary.sh target/x86_64-unknown-linux-musl/release/webctl
          scripts/check-static-binary.sh target/x86_64-unknown-linux-musl/release/webctl-mcp --no-smoke
