# 由 dist-workspace.toml 的 github-build-setup 引用：cargo-dist 会把这些步骤
# 注入到每个 build-local-artifacts 作业的构建步骤之前。
#
# 为什么需要它：wreq 使用 BoringSSL（btls-sys），其 CMake 构建需要
#   - Windows：NASM（BoringSSL 的 .asm 汇编）；
#   - Linux musl：x86_64-linux-musl-{gcc,g++}（musl-tools 只提供 musl-gcc）。
# 缺任一项时 v0.1.0 首次发布在 musl 与 Windows 上失败（CMake enable_language）。
- name: Install extra build toolchain (BoringSSL / btls-sys)
  shell: bash
  run: |
    set -eux
    if [ "${RUNNER_OS}" = "Windows" ]; then
      choco install nasm -y
      echo "C:/Program Files/NASM" >> "$GITHUB_PATH"
    elif [ "${RUNNER_OS}" = "Linux" ]; then
      sudo apt-get update
      sudo apt-get install -y musl-tools
      # 交叉编译器别名：CMake 按三元组查找 x86_64-linux-musl-{gcc,g++}
      sudo ln -sf "$(command -v musl-gcc)" /usr/local/bin/x86_64-linux-musl-gcc
      printf '#!/bin/sh\nexec g++ -static "$@"\n' | sudo tee /usr/local/bin/x86_64-linux-musl-g++ >/dev/null
      sudo chmod +x /usr/local/bin/x86_64-linux-musl-g++
    fi
